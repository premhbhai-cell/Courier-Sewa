    <style>
        /* ── Modern Tracking Design System (Harmonized with ESE Brand Theme) ── */
        :root {
            --tr-ink: #06201f;
            --tr-primary: #004d4d;
            --tr-primary-dark: #00302f;
            --tr-accent: #F5C518;
            --tr-accent-teal: #0d9488;
            --tr-accent-bright: #00d4a8;
            --tr-accent-soft: rgba(0, 212, 168, 0.12);
            --tr-gold: #fdf503;
            --tr-gold-dark: #e1c804;
            --tr-on-gold: #1b1200;
            --tr-success: #10b981;
            --tr-warning: #f59e0b;
            --tr-danger: #ef4444;
            --tr-info: #0284c7;
            --tr-bg: #f5f9f9;
            --tr-card: #ffffff;
            --tr-text: #0f2e2c;
            --tr-muted: #527573;
            --tr-border: #e2ecec;
            --tr-border-strong: #d3e2e2;
            --tr-radius: 16px;
            --tr-shadow: 0 10px 30px -5px rgba(0, 77, 77, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
            --tr-shadow-lg: 0 20px 40px -10px rgba(0, 77, 77, 0.14), 0 8px 20px -4px rgba(0, 0, 0, 0.06);
        }

        /* ── Tracking Hero ──────────────────────────────────────── */
        .tracking-hero-modern {
            background: linear-gradient(135deg, #002b2a 0%, #004d4d 50%, #00302f 100%);
            padding: clamp(60px, 8vw, 95px) 0 clamp(70px, 9vw, 105px);
            text-align: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }
        .tracking-hero-modern::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(0, 212, 168, 0.18) 0%, transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(253, 245, 3, 0.12) 0%, transparent 50%);
            pointer-events: none;
        }
        .tracking-badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 168, 0.35);
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #00d4a8;
            margin-bottom: 18px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }
        .tracking-badge-pill i {
            animation: pulse-dot 1.8s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }
        .tracking-hero-modern h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .tracking-hero-modern p {
            color: rgba(255, 255, 255, 0.88);
            font-size: clamp(1rem, 1.4vw, 1.15rem);
            max-width: 600px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }

        /* ── Modern Search Bar ──────────────────────────────────── */
        .search-box-card {
            max-width: 640px;
            margin: 0 auto;
            position: relative;
            z-index: 5;
        }
        .search-input-wrap {
            display: flex;
            align-items: center;
            background: #ffffff;
            padding: 6px 8px 6px 20px;
            border-radius: 100px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.2);
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }
        .search-input-wrap:focus-within {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), 0 0 0 3px rgba(0, 212, 168, 0.5);
            transform: translateY(-2px);
        }
        .search-icon-prefix {
            font-size: 1.25rem;
            color: var(--tr-accent-teal);
            margin-right: 12px;
            display: flex;
            align-items: center;
        }
        .search-input-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--tr-text);
            background: transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .search-input-wrap input::placeholder {
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: normal;
            text-transform: none;
        }
        .search-btn-modern {
            background: linear-gradient(135deg, var(--tr-gold) 0%, var(--tr-gold-dark) 100%);
            color: var(--tr-on-gold);
            border: none;
            padding: 14px 32px;
            font-size: 0.96rem;
            font-weight: 800;
            border-radius: 100px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(225, 200, 4, 0.38);
            transition: all 0.22s ease;
            white-space: nowrap;
        }
        .search-btn-modern:hover {
            background: linear-gradient(135deg, #ffffff 0%, var(--tr-gold) 100%);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(225, 200, 4, 0.55);
            color: var(--tr-on-gold);
        }

        /* ── Results Container ─────────────────────────────────── */
        .tracking-results-area {
            background: var(--tr-bg);
            padding: 40px 0 80px;
            min-height: 450px;
            margin-top: -30px;
            position: relative;
            z-index: 10;
        }

        /* ── Tracking Main Card ────────────────────────────────── */
        .track-card-outer {
            background: #ffffff;
            border-radius: var(--tr-radius);
            box-shadow: var(--tr-shadow-lg);
            border: 1px solid rgba(226, 232, 240, 0.8);
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* ── Tracking Header & Status ──────────────────────────── */
        .track-card-header {
            padding: 24px 32px;
            background: #ffffff;
            border-bottom: 1px solid var(--tr-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .awb-meta-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--tr-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }
        .awb-number-badge {
            font-size: 1.45rem;
            font-weight: 900;
            color: var(--tr-primary);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-copy-awb {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #475569;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-copy-awb:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        /* Tracking number and forwarding number (the booking's AWB / Ref Number)
           side by side, each a label over its value with an icon-only copy button. */
        .awb-ids {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 12px 24px;
        }
        .awb-fwd-no {
            padding-left: 24px;
            border-left: 2px solid var(--tr-border);
        }

        /* ── Status Pills ───────────────────────────────────────── */
        .live-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 0.92rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .status-dot-pulse {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-pill-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .status-pill-success .status-dot-pulse { background: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25); }

        .status-pill-transit {
            background: #e0f2fe;
            color: #075985;
            border: 1px solid #bae6fd;
        }
        .status-pill-transit .status-dot-pulse { background: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25); }

        .status-pill-warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        .status-pill-warning .status-dot-pulse { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25); }

        .status-pill-danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .status-pill-danger .status-dot-pulse { background: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25); }

        /* ── Route Journey Banner ───────────────────────────────── */
        .route-journey-banner {
            background: linear-gradient(135deg, #f0fdf9 0%, #e6f7f5 100%);
            padding: 24px 32px;
            border-bottom: 1px solid var(--tr-border);
        }
        .route-flex-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .route-stop {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .route-stop-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid var(--tr-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--tr-accent);
            box-shadow: 0 4px 10px rgba(0, 77, 77, 0.05);
        }
        .route-stop-info .stop-type {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--tr-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .route-stop-info .stop-city {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--tr-text);
            margin-top: 2px;
        }
        .route-stop-info .stop-sub {
            font-size: 0.82rem;
            color: var(--tr-muted);
        }
        .route-line-connector {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 0 20px;
        }
        .route-line-track {
            width: 100%;
            height: 3px;
            background: #cbd5e1;
            border-radius: 4px;
            position: relative;
        }
        .route-carrier-pill {
            position: absolute;
            top: -15px;
            z-index: 2;
            background: #ffffff;
            border: 1px solid var(--tr-accent-teal);
            border-radius: 100px;
            padding: 3px 14px;
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--tr-primary);
            box-shadow: 0 2px 8px rgba(0, 77, 77, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ── Shipment 4-Item Metric Grid ────────────────────────── */
        .metrics-grid-modern {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1px;
            background: var(--tr-border);
            border-bottom: 1px solid var(--tr-border);
        }
        .metric-cell {
            background: #ffffff;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .metric-icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(0, 102, 102, 0.08);
            color: var(--tr-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .metric-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--tr-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-val {
            font-size: 0.98rem;
            font-weight: 800;
            color: var(--tr-text);
            margin-top: 2px;
        }
        .metric-sub {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--tr-muted);
        }

        /* ── Stepper ────────────────────────────────────────────── */
        .stepper-container-modern {
            padding: 36px 32px 30px;
            background: #ffffff;
            border-bottom: 1px solid var(--tr-border);
        }
        .stepper-track-modern {
            display: flex;
            position: relative;
            justify-content: space-between;
        }
        .stepper-step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .stepper-step::before {
            content: '';
            position: absolute;
            top: 22px;
            /* From the previous circle's edge to this circle's edge (46px wide). */
            left: calc(-50% + 23px);
            width: calc(100% - 46px);
            height: 4px;
            background: #e2e8f0;
            z-index: -1;
        }
        .stepper-step:first-child::before { display: none; }
        .stepper-step.is-done::before { background: linear-gradient(90deg, var(--tr-primary), var(--tr-accent-teal), var(--tr-accent-bright)); }
        .stepper-step.is-active::before { background: linear-gradient(to right, var(--tr-accent-teal) 0%, #e2e8f0 100%); }

        .stepper-icon-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #f1f5f9;
            border: 3px solid #e2e8f0;
            color: #94a3b8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            transition: all 0.25s ease;
        }
        .stepper-step.is-done .stepper-icon-circle {
            background: linear-gradient(135deg, var(--tr-primary-dark) 0%, var(--tr-primary) 100%);
            border-color: var(--tr-accent-bright);
            color: var(--tr-gold);
            box-shadow: 0 4px 12px rgba(0, 77, 77, 0.25);
        }
        .stepper-step.is-active .stepper-icon-circle {
            background: #ffffff;
            border-color: var(--tr-primary);
            color: var(--tr-primary);
            box-shadow: 0 0 0 6px rgba(0, 102, 102, 0.18);
        }
        .stepper-step-title {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--tr-muted);
        }
        .stepper-step.is-done .stepper-step-title,
        .stepper-step.is-active .stepper-step-title {
            color: var(--tr-text);
            font-weight: 800;
        }
        .stepper-step-sub {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* ── POD Showcase Card ──────────────────────────────────── */
        .pod-showcase-box {
            margin: 24px 32px;
            padding: 24px;
            background: linear-gradient(135deg, rgba(0, 212, 168, 0.12) 0%, rgba(0, 102, 102, 0.04) 100%);
            border: 1px solid rgba(0, 212, 168, 0.35);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .pod-showcase-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .pod-showcase-badge-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: #ffffff;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }
        .pod-showcase-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .pod-showcase-desc {
            font-size: 0.88rem;
            color: #475569;
        }
        .btn-view-pod-doc {
            background: #F5C518;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 16px rgba(0, 102, 102, 0.25);
            transition: all 0.2s ease;
        }
        .btn-view-pod-doc:hover {
            background: #004d4d;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(0, 102, 102, 0.35);
            color: #ffffff;
        }

        /* ── Activity History & Dual View ───────────────────────── */
        .history-section-header {
            padding: 20px 32px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--tr-border);
            flex-wrap: wrap;
            gap: 12px;
        }
        .history-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .view-switcher-group .btn-view-toggle {
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 700;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .view-switcher-group .btn-view-toggle.active {
            background: var(--tr-primary);
            border-color: var(--tr-primary);
            color: #ffffff;
        }

        /* ── Vertical Timeline ──────────────────────────────────── */
        .timeline-modern-wrap {
            padding: 30px 32px 40px;
        }
        .tracking-timeline {
            position: relative;
            padding-left: 28px;
        }
        .tracking-timeline::before {
            content: '';
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 7px;
            width: 2px;
            background: #e2e8f0;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 28px;
        }
        .timeline-item:last-child {
            margin-bottom: 0;
        }
        .timeline-node-dot {
            position: absolute;
            left: -28px;
            top: 4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #cbd5e1;
            z-index: 2;
        }
        .timeline-item.is-latest .timeline-node-dot {
            border-color: var(--tr-accent);
            background: var(--tr-primary);
            box-shadow: 0 0 0 4px rgba(0, 212, 168, 0.25);
        }
        .timeline-card-content {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px 20px;
            transition: all 0.15s ease;
        }
        .timeline-item.is-latest .timeline-card-content {
            background: #ffffff;

    <script>
        // Auto-uppercase AWB input
        var awbInput = document.querySelector('input[name="awb"]');
        if (awbInput) {
            awbInput.addEventListener('input', function () {
                this.value = this.value.toUpperCase();
            });
        }
    </script>
    <script>
        function copyAwbToClipboard(awb, btn) {
            if (!awb) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(awb).then(function() {
                    showCopiedFeedback(btn);
                }).catch(function() {
                    fallbackCopyText(awb, btn);
                });
            } else {
                fallbackCopyText(awb, btn);
            }
        }

        function fallbackCopyText(text, btn) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showCopiedFeedback(btn);
        }

        // Icon-only buttons: the clicked one shows a check for a moment.
        function showCopiedFeedback(btn) {
            if (btn && !btn.dataset.copied) {
                var oldHtml = btn.innerHTML;
                btn.dataset.copied = '1';
                btn.innerHTML = '<i class="fa-solid fa-check text-success"></i>';
                setTimeout(function() { btn.innerHTML = oldHtml; delete btn.dataset.copied; }, 2000);
            }
        }

        // Table view is the default; a visitor who picks Timeline keeps it.
        function setTrackingView(view, remember) {
            var timelineWrap = document.getElementById('trackingTimelineView');
            var tableWrap = document.getElementById('trackingTableView');
            var btnTimeline = document.getElementById('btnViewTimeline');
            var btnTable = document.getElementById('btnViewTable');
            var isTable = view !== 'timeline';

            if (timelineWrap) timelineWrap.classList.toggle('is-hidden', isTable);
            if (tableWrap) tableWrap.classList.toggle('is-hidden', !isTable);
            if (btnTimeline) btnTimeline.classList.toggle('active', !isTable);
            if (btnTable) btnTable.classList.toggle('active', isTable);
            if (remember !== false) {
                try { localStorage.setItem('tracking_view', isTable ? 'table' : 'timeline'); } catch (e) {}
            }
        }
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('tracking_view'); } catch (e) {}
            if (saved === 'timeline') setTrackingView('timeline', false);
        })();
</script>
