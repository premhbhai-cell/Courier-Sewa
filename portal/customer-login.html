<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courier Eva — Customer Login</title><link rel="stylesheet" href="portal.css"></head><body><div class="login"><div class="login-card"><img class="login-logo" src="../images/logo.png" alt="Courier Eva"><h1>Customer Login</h1><p class="muted" style="text-align:center">Login to book courier services, get estimates and track shipments.</p><form id="f"><div class="field"><label>Email / Mobile</label><input id="email" required placeholder="customer@example.com"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" required type="password" placeholder="Password"></div><div class="actions"><button class="nav-btn primary">Continue to Customer Portal</button><a class="nav-btn" href="register.html?role=customer">Create Account</a><a class="nav-btn" href="../index.html">Website</a></div></form><div id="err" style="color:#b22e2e;font-size:12px;margin-top:10px"></div><div class="notice">Create an account first for the customer portal. Your demo account is stored only in this browser.</div></div></div><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const a=JSON.parse(localStorage.getItem('courierEvaCustomerAccount')||'null');const em=document.getElementById('email').value.trim().toLowerCase(),pw=document.getElementById('password').value;if(!a){document.getElementById('err').textContent='No customer account found. Please create an account first.';return}if(em===a.email&&pw===a.password){localStorage.setItem('courierEvaCustomerSession',JSON.stringify({email:em,loginAt:new Date().toISOString()}));location.href='customer-portal.html'}else document.getElementById('err').textContent='Invalid customer login.'}</script></body></html>
